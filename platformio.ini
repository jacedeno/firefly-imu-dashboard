; Firefly Blue Ghost IMU — firmware for Arduino Nano 33 BLE (LSM9DS1, confirmed)
; 9-DOF Madgwick fusion streamed over BLE (Web Bluetooth). See PLAN.md.

[env:nano33ble]
platform = nordicnrf52
board = nano33ble
framework = arduino
monitor_speed = 115200
; NOTE: build on x86 only. The mbed core requires the platform-default GCC 7.2
; (toolchain-gccarmnoneeabi ~1.70201.0), which has no linux_aarch64 binary. The
; arm64 GCCs that do exist (10/12/14) compile but produce an image that does not
; boot on the nRF52840 (no USB/BLE).
;   - On an x86_64 host: `pio run -e nano33ble -t upload` works locally. This is
;     the normal path (verified 2026-08-05).
;   - On an aarch64 host (e.g. Asahi Linux): local builds are unsupported — use
;     the GitHub Actions x86 build (.github/workflows/build-firmware.yml) and
;     flash the resulting firmware.bin. See TROUBLESHOOTING.md.
; macOS on Apple Silicon worked because it ran the x86 GCC 7.2 under Rosetta 2.
lib_deps =
    arduino-libraries/ArduinoBLE@^1.3.7
    arduino-libraries/Arduino_LSM9DS1@^1.1.1
